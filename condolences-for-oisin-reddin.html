{"n":116,"author":"Mr. Shannon","message":"I had the pleasure of teaching Oisín in 4th class, and he was such a sweet boy. Oisín was full of character, kind, caring, and a true friend to everyone around him. He was a football fanatic and would ask every day if he could carry the ball out to the yard, a small moment that so perfectly captured his enthusiasm and joy. Oisín was an eager and enthusiastic boy who always tried his best, and he loved telling stories that filled the room with laughter and cheer. Every so often, he would proudly ask if he could do a show and tell, whether it was a photo, a new football, a card, or a fidget toy, he was always so eager to share his happiness with others. He was deeply loved by both staff and students in Mary Queen of Angels 2, and his warmth and positivity shone through every day. Oisín will be sorely missed by us all and will forever be remembered with great fondness. My deepest sympathies are with his family and loved ones at this heartbreaking time."},

    <script src="hark.js"></script>
    <script>
      (function () {
        var el = document.getElementById("condolences");
        var data = JSON.parse(el.textContent);
        var list = document.getElementById("msgs");
        var count = document.getElementById("count");
        var empty = document.getElementById("empty");
        var input = document.getElementById("q");
        var total = data.length;
        function norm(s) {
          return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }
        var items = data.map(function (d) {
          var li = document.createElement("li");
          li.className = "x-msg";
          var p = document.createElement("p");
          p.className = "x-msg__text";
          p.textContent = d.message;
          var a = document.createElement("p");
          a.className = "x-msg__author";
          a.textContent = "\u2014 " + d.author;
          li.appendChild(p);
          li.appendChild(a);
          list.appendChild(li);
          return { li: li, key: norm(d.message + "\n" + d.author) };
        });
        function update() {
          var q = norm(input.value).trim();
          var shown = 0;
          items.forEach(function (it) {
            var hit = !q || it.key.indexOf(q) !== -1;
            it.li.hidden = !hit;
            if (hit) shown++;
          });
          count.textContent = "Showing " + shown + " of " + total + " messages";
          empty.hidden = shown !== 0;
        }
        input.addEventListener("input", update);
        update();
      })();
    </script>
